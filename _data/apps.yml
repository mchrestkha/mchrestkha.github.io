# Things I have built and put online. Newest first.

- name: Sound Travels
  url: https://mchrestkha.github.io/volgabeat
  tagline: "Most music never leaves home."
  description: >-
    A world map of YouTube's music charts, every country shaded from deep sea,
    where it plays what the world plays, to gold, where its chart is songs
    charting nowhere else. Pick a country to see its top ten right now, then
    pick a song to play it and watch every other country it is charting in
    light up by chart position.

- name: Hip Hop Lineage
  url: https://mchrestkha.github.io/hiphophistory/
  tagline: "43 cities, 300 names, one shared lineage."
  description: >-
    A map, then one scroll, region by region. The map plays from a Bronx rec
    room in 1973 to Lagos, Seoul and Mumbai, each city landing in its year with
    an arc from the scenes it came out of. Below, every stop is a city where a
    scene caught fire: what it sounded like, why it mattered, its bloodline,
    and who to hear.
