title: Mikhail Chrestkha
tagline: AI Infrastructure & AI Platforms
description: >-
  Mikhail Chrestkha on AI infrastructure and AI platforms — talks and writing
  on getting models from prototype to production, and side projects that map
  the world's music.
url: https://mchrestkha.github.io
lang: en-US

author:
  name: Mikhail Chrestkha

# Rendered in the masthead, in this order.
social_links:
  - name: LinkedIn
    url: https://www.linkedin.com/in/mchrestkha/
  - name: GitHub
    url: https://github.com/mchrestkha
  - name: Medium
    url: https://medium.com/@mchrestkha
  - name: Instagram
    url: https://www.instagram.com/mikogptsidequests/

# Both are on the GitHub Pages allowlist. Listing them explicitly means the SEO
# and sitemap output does not depend on a theme gem's dependencies being
# auto-loaded — the site carries no theme gem at all.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Google Analytics 4. The same property also covers /hiphoplineage/ and
# /soundtravels/, which are served under this domain. _layouts/default.html
# loads gtag.js only in a production build (GitHub Pages builds as production;
# `jekyll serve` does not), so local previews send nothing. Remove to turn off.
google_analytics: G-FEVFDVT16F

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
