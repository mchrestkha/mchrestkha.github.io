<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="alternate icon" href="{{ '/assets/favicon.png' | relative_url }}">
    <style>
      /* ---------------------------------------------------------------
         Tokens. Nothing below this block invents a colour, size or space
         value. There is one theme and it is light: a second theme means
         every colour decision has to be made and validated twice, and the
         page has no toggle to offer the choice with. The palette is
         contrast-checked, not eyeballed — body text clears WCAG AAA (7:1),
         muted text and links clear AA (4.5:1) on every surface.
         --------------------------------------------------------------- */
      :root {
        color-scheme: light;

        --bg: #fbfaf9;
        --surface: #ffffff;
        --ink: #1a1613;
        --muted: #5f5751;
        --accent: #b81406;
        --border: #d8cfc8;

        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;

        --step--1: 0.8125rem;
        --step-0: 1rem;
        --step-1: 1.125rem;
        --step-2: 1.375rem;
        --step-3: 1.875rem;

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --space-6: 2.5rem;
        --space-7: 4rem;

        --radius: 10px;
        --measure: 46rem;
        --rail: 3.25rem;
      }

      /* --------------------------------------------------------------- */

      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: var(--step-0);
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: var(--measure);
        margin: 0 auto;
        padding: var(--space-6) var(--space-5) var(--space-7);
      }

      a { color: var(--accent); }
      a:focus-visible, button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 2px;
      }

      /* --- masthead --------------------------------------------------- */

      .masthead {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        margin-bottom: var(--space-6);
      }

      .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        flex: none;
        background: var(--surface);
      }

      .masthead h1 {
        font-size: var(--step-3);
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0;
      }

      .role {
        margin: var(--space-1) 0 var(--space-2);
        color: var(--muted);
        font-size: var(--step-0);
      }

      .social {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        font-size: var(--step--1);
      }

      .social a {
        color: var(--muted);
        text-decoration-color: var(--border);
        text-underline-offset: 2px;
      }
      .social a:hover { color: var(--accent); text-decoration-color: currentColor; }

      /* --- prose ------------------------------------------------------ */

      .intro { font-size: var(--step-1); margin: 0 0 var(--space-6); }
      .intro p { margin: 0 0 var(--space-4); }
      .intro p:last-child { margin-bottom: 0; }

      section { margin-bottom: var(--space-7); }
      section:last-of-type { margin-bottom: var(--space-6); }

      h2 {
        font-size: var(--step-2);
        letter-spacing: -0.01em;
        margin: 0 0 var(--space-5);
        padding-bottom: var(--space-3);
        border-bottom: 1px solid var(--border);
      }

      /* --- apps ------------------------------------------------------- */

      .apps { display: grid; gap: var(--space-4); }

      .app {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-5);
      }

      .app h3 { font-size: var(--step-1); margin: 0 0 var(--space-1); }
      .app h3 a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
      .app .tagline { margin: 0 0 var(--space-2); color: var(--ink); font-style: italic; }
      .app p:last-child { margin: 0; color: var(--muted); font-size: var(--step--1); line-height: 1.55; }

      /* --- the list of talks and writing ------------------------------ */

      .year { margin-bottom: var(--space-5); }

      .year h3 {
        font-size: var(--step--1);
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 var(--space-3);
      }

      .entries { list-style: none; margin: 0; padding: 0; }

      .entry {
        display: grid;
        grid-template-columns: var(--rail) 1fr;
        gap: var(--space-4);
        padding: var(--space-3) 0;
        border-top: 1px solid var(--border);
      }

      .entry time {
        color: var(--muted);
        font-size: var(--step--1);
        font-variant-numeric: tabular-nums;
        padding-top: 0.15em;
      }

      .entry-title { margin: 0; font-size: var(--step-0); font-weight: 600; line-height: 1.45; }
      .entry-note { margin: var(--space-1) 0 0; color: var(--muted); font-size: var(--step--1); }

      .entry-links {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        margin-top: var(--space-2);
        font-size: var(--step--1);
      }
      .entry-links a { text-decoration-color: var(--border); text-underline-offset: 2px; }
      .entry-links a:hover { text-decoration-color: currentColor; }

      /* --- footer ----------------------------------------------------- */

      footer {
        border-top: 1px solid var(--border);
        padding-top: var(--space-4);
        color: var(--muted);
        font-size: var(--step--1);
      }
      footer p { margin: 0 0 var(--space-2); }
      footer p:last-child { margin-bottom: 0; }
      footer a { color: var(--muted); text-decoration-color: var(--border); }
      footer a:hover { color: var(--accent); }

      /* --- narrow screens --------------------------------------------- */

      @media (max-width: 34rem) {
        .page { padding: var(--space-5) var(--space-4) var(--space-6); }
        .masthead { gap: var(--space-3); }
        .avatar { width: 56px; height: 56px; }
        :root { --step-3: 1.5rem; --step-1: 1.0625rem; }
        .entry { grid-template-columns: 1fr; gap: var(--space-1); }
        .entry time { padding-top: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <picture>
          <source srcset="{{ '/images/avatar.webp' | relative_url }}" type="image/webp">
          <img class="avatar" src="{{ '/images/avatar.png' | relative_url }}"
               width="72" height="72" alt="{{ site.title }}">
        </picture>
        <div>
          <h1>{{ site.title }}</h1>
          <p class="role">{{ site.tagline }}</p>
          <nav class="social" aria-label="Elsewhere">
            {% for link in site.social_links %}
              <a href="{{ link.url }}" rel="me">{{ link.name }}</a>
            {% endfor %}
          </nav>
        </div>
      </header>

      <main>
        {{ content }}
      </main>

      <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}.</p>
      </footer>
    </div>
  </body>
</html>
